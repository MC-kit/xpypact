[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.11,<0.12" ]

[project]
name = "xpypact"
version = "0.13.1.dev1"
description = "Python workflow framework for FISPACT."
readme = "README.rst"
keywords = [ "activation", "duckdb", "FISPACT", "nuclide", "polars" ]
license = { text = "MIT" }
authors = [ { name = "dvp2015", email = "dmitri_portnov@yahoo.com" } ]
requires-python = ">=3.12,<3.15"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "duckdb>=1.5.2",
  "mckit-nuclides>=0.3.2",
  "msgspec>=0.19",
  "numpy>=2.4",
  "polars[all]>=1.37",
  "pyarrow>=18",           # this is not used directly, but is required by duckdb
]
urls.Changelog = "https://github.com/MC-kit/xpypact/releases"
urls.documentation = "https://xpypact.readthedocs.io"
urls.homepage = "https://github.com/MC-kit/xpypact"
urls.repository = "https://github.com/MC-kit/xpypact"

[dependency-groups]
dev = [ { include-group = "style" }, { include-group = "test" } ]
test = [
  "pytest>=9",
  "pytest-cov>=7.1",
  "pytest-durations>=1.5",
  "pytest-mock>=3.14",
  "pytest-xdist[psutil]>=3.8",
  "xdoctest>=1.2",
]
docs = [
  "rstcheck[sphinx,toml]>=6.2.5",
  "sphinx>=9.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-autodoc-typehints>=3.2",
  "sphinx-togglebutton>=0.3.2",
]
analyze = [ "jupyterlab>=4.2.5", "jupytext>=1.16.4" ]
coverage = [ "coverage[toml]>=7.9.2" ]
lint = [ "pylint", "pylint-per-file-ignores" ]
mypy = [ "mypy>=1.2", "pep8-naming>=0.12.1", "types-setuptools>=80.9.0.20250529" ]
pre_commit = [
  "pre-commit>=4.3",
  { include-group = "sql" },
]
pyright = [ "pyright>=1.1.406" ]
ruff = [ "ruff>=0.0.259" ]
sql = [
  "sqlfluff>=3.4.1",
]
style = [
  { include-group = "lint" },
  { include-group = "mypy" },
  { include-group = "pre_commit" },
  { include-group = "pyright" },
  { include-group = "ruff" },
  { include-group = "sql" },
]
# environments not in dev
typeguard = [ "typeguard>=4.1.5" ]

[tool.coverage]
run.branch = true
run.omit = [ "**/__init__.py", "*_tab.py", "tools/*.py" ]
run.parallel = true
run.source = [ "src" ]
paths.source = [ "src", ".nox/*/site-packages" ]
# Regexes for lines to exclude from consideration
report.exclude_lines = [
  # Don't complain about missing debug-only code:
  "def __repr__",
  "if __name__ == .__main__.:",
  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if self.debug",
  "if TYPE_CHECKING:",
  # Have to re-enable the standard pragma
  "pragma: no cover",
  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",
]
report.fail_under = 100
report.ignore_errors = true
report.omit = [ "**/__init__.py", "**/types.py", "*_tab.py" ]
report.show_missing = true
report.skip_covered = true
report.sort = "Cover"

# MyPy config
# See https://mypy.readthedocs.io/en/stable/config_file.html#using-a-pyproject-toml-file
#     https://dev.to/tusharsadhwani/the-comprehensive-guide-to-mypy-561m

[tool.mypy]
python_version = "3.13"
cache_dir = ".cache/mypy"
files = "src/**/*.py"
follow_imports = "silent"
pretty = true
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "cyclopts",
  "dask.*",
  "duckdb",
  "eliot",
  "eliot.*",
  "loguru",
  "mckit_nuclides.*",
  "msgspec",
  "numpy",
  "numpy.testing",
  "pandas",
  "polars",
  "pytest",
  "rich.*",
  "scipy.constants",
  "scipy.sparse",
  "tomli",
  "tomllib",
  "xdoctest",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "tomllib" ]
allow_redefinition = true
disable_error_code = "no-redef"

[tool.xdoctest]
quiet = true
options = ""

[tool.jupytext]
# https://jupytext.readthedocs.io/en/latest/config.html
# Pair ipynb notebooks to py:percent text notebooks
formats = "ipynb,py:percent"

[tool.creosote]
paths = [ "src" ]
deps-file = "pyproject.toml"
exclude-deps = [ "duckdb", "pyarrow" ]
sections = [ "project.dependencies" ]

[tool.rstcheck]
report_level = "ERROR"
ignore_messages = '(Unknown directive type "(todo.*|automodule)".$)'
