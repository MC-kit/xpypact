[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13,<0.14" ]

[project]
name = "xpypact"
version = "0.13.3.dev1"
description = "Python workflow framework for FISPACT."
readme = "README.rst"
keywords = [ "activation", "duckdb", "FISPACT", "nuclide", "polars" ]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  # "Programming Language :: Python :: 3.15",  # TODO @dvp: wait for duckdb wheels
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "duckdb>=1",
  "mckit-nuclides>=0.3.2",
  "msgspec>=0.19",
  "numpy>=2.4",
  "polars[numpy,pyarrow]>=2",
]
[[project.authors]]
name = "dvp2015"
email = "dmitri_portnov@yahoo.com"
[project.urls]
Changelog = "https://github.com/MC-kit/xpypact/releases"
documentation = "https://xpypact.readthedocs.io"
homepage = "https://github.com/MC-kit/xpypact"
repository = "https://github.com/MC-kit/xpypact"

[dependency-groups]
dev = [ { include-group = "style" }, { include-group = "test" } ]
test = [
  "pytest>=9",
  "pytest-cov>=7.1",
  # "pytest-durations>=1.5",
  "pytest-mock>=3.15",
  # "pytest-xdist[psutil]>=3.8",
  "xdoctest>=1.3",
]
docs = [
  "rstcheck[sphinx,toml]>=6.2.5",
  "sphinx>=9.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-autodoc-typehints>=3.10",
  "sphinx-togglebutton>=0.4",
]
analyze = [
  "duckdb>=1.5.5",
  "marimo>=0.23.14",
  "polars>=2",
  "pyarrow>=26",
  "rich>=15",
  "sqlglot>=30",
]
mypy = [ "mypy>=1.2", "pep8-naming>=0.12.1", "types-setuptools>=80.9.0.20250529" ]
pre_commit = [
  "pre-commit>=4.3",
  { include-group = "sql" },
]
pylint = [ "pylint", "pylint-per-file-ignores>=3.2.1" ]
pyright = [ "pyright>=1.1.406" ]
ruff = [ "ruff>=0.0.259" ]
sql = [
  "sqlfluff>=3.4.1",
]
style = [
  "basedpyright>=1.39.9",
  "pyrefly>=1.1.1",
  { include-group = "mypy" },
  { include-group = "pre_commit" },
  { include-group = "pylint" },
  { include-group = "pyright" },
  { include-group = "ruff" },
  { include-group = "sql" },
]
ty = [ "ty>=0.0.84" ]
typeguard = [ "typeguard>=4.5" ]

# MyPy config
# See https://mypy.readthedocs.io/en/stable/config_file.html#using-a-pyproject-toml-file
#     https://dev.to/tusharsadhwani/the-comprehensive-guide-to-mypy-561m
[tool.mypy]
files = "src/**/*.py"
follow_imports = "silent"
python_version = "3.14"
strict = true
pretty = true
cache_dir = ".cache/mypy"
warn_unused_configs = true
[[tool.mypy.overrides]]
module = [
  "duckdb",
  "mckit_nuclides.*",
  "msgspec",
  "numpy",
  "numpy.testing",
  "pandas",
  "polars",
  "pytest",
  "xdoctest",
]
ignore_missing_imports = true

[tool.coverage.paths]
source = [ "src" ]
[tool.coverage.report]
exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if 0:",
  "if TYPE_CHECKING:",
  "if self.debug",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 100
ignore_errors = true
omit = [ "**/__init__.py", "**/types.py", "*_tab.py" ]
show_missing = true
skip_covered = true
sort = "Cover"
[tool.coverage.run]
branch = true
omit = [ "**/__init__.py", "*_tab.py", "tools/*.py" ]
parallel = true
source = [ "src" ]

[tool.marimo.runtime]
pythonpath = [ "notebooks", "notebooks/nb_common" ]

[tool.xdoctest]
options = ""
quiet = true

[tool.creosote]
deps-file = "pyproject.toml"
paths = [ "src" ]
exclude-deps = [ "duckdb", "pyarrow" ]
sections = [ "project.dependencies" ]
venvs = [ ".venv" ]

[tool.rstcheck]
ignore_messages = '(Unknown directive type \"cyclopts|todo|(auto(module|class|function))\"\.)'
report_level = "ERROR"
